<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prosessbibliotek</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<!-- Plausible analytics - bytt ut DITTDOMENE.github.io med din faktiske domene -->
<script defer data-domain="DITTDOMENE.github.io" src="https://plausible.io/js/script.tagged-events.js"></script>
<style>
  :root {
    --bg: #f5f2ec;
    --surface: #ffffff;
    --ink: #1a1a18;
    --ink-muted: #6b6860;
    --accent: #2d5a3d;
    --accent-light: #e8f0ea;
    --accent2: #c17f24;
    --border: #ddd9d0;
    --shadow-hover: 0 8px 32px rgba(0,0,0,0.14);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Source Sans 3', sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; }

  header {
    background: var(--accent); color: white;
    padding: 28px 40px 24px;
    display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
  header h1 { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 700; letter-spacing: -0.5px; }
  header p { font-size: 0.95rem; opacity: 0.8; margin-top: 4px; }

  .search-bar { padding: 20px 40px 0; }
  .search-bar input {
    width: 100%; max-width: 420px;
    padding: 10px 16px; border: 1.5px solid var(--border); border-radius: 8px;
    background: white; font-family: 'Source Sans 3', sans-serif; font-size: 0.95rem;
    color: var(--ink); outline: none; transition: border-color 0.2s;
  }
  .search-bar input:focus { border-color: var(--accent); }

  #dashboard {
    padding: 24px 40px 60px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px;
  }

  .card {
    background: var(--surface); border: 1.5px solid var(--border); border-radius: 10px;
    padding: 24px 22px 20px; cursor: pointer;
    transition: box-shadow 0.2s, transform 0.2s, border-color 0.2s;
    position: relative; overflow: hidden;
  }
  .card::before {
    content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%;
    background: var(--accent); opacity: 0; transition: opacity 0.2s;
  }
  .card:hover { box-shadow: var(--shadow-hover); transform: translateY(-3px); border-color: var(--accent); }
  .card:hover::before { opacity: 1; }
  .card-icon { font-size: 1.6rem; margin-bottom: 10px; display: block; }
  .card h2 { font-family: 'Playfair Display', serif; font-size: 1.15rem; font-weight: 700; margin-bottom: 8px; line-height: 1.3; }
  .card p { font-size: 0.875rem; color: var(--ink-muted); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .card-steps { margin-top: 12px; font-size: 0.78rem; color: var(--accent); font-weight: 600; letter-spacing: 0.3px; }

  /* Om meg-kort */
  .card.about-card { background: var(--accent); color: white; border-color: var(--accent); }
  .card.about-card:hover { border-color: var(--accent2); box-shadow: 0 8px 32px rgba(45,90,61,0.3); }
  .card.about-card::before { background: var(--accent2); }
  .card.about-card h2 { color: white; }
  .card.about-card p { color: rgba(255,255,255,0.8); }
  .card.about-card .card-steps { color: var(--accent2); }

  /* Kontakt-panel innhold */
  .contact-list { list-style: none; padding: 0; margin: 8px 0 0; }
  .contact-list li { padding: 12px 0; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 14px; }
  .contact-list li:last-child { border-bottom: none; }
  .contact-icon { flex-shrink: 0; width: 36px; height: 36px; border-radius: 50%; background: var(--accent-light); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
  .contact-label { font-size: 0.75rem; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 2px; }
  .contact-value { font-size: 0.95rem; color: var(--ink); word-break: break-all; }
  .contact-value a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .contact-value a:hover { text-decoration: underline; }

  .empty-state { grid-column: 1/-1; text-align: center; padding: 60px 20px; color: var(--ink-muted); }
  .empty-state h3 { font-family: 'Playfair Display', serif; font-size: 1.4rem; margin-bottom: 8px; }

  #overlay { display: none; position: fixed; inset: 0; background: rgba(26,26,24,0.5); z-index: 100; backdrop-filter: blur(2px); }
  #overlay.open { display: flex; align-items: flex-start; justify-content: flex-end; }

  #panel {
    background: var(--surface); width: min(680px, 100vw); height: 100vh;
    overflow-y: auto; padding: 36px 40px 60px;
    animation: slideIn 0.25s ease; position: relative;
  }
  @keyframes slideIn { from { transform: translateX(40px); opacity:0; } to { transform: translateX(0); opacity:1; } }

  #closeBtn {
    position: absolute; top: 20px; right: 24px; background: none; border: none;
    font-size: 1.5rem; cursor: pointer; color: var(--ink-muted); line-height: 1;
    padding: 4px 8px; border-radius: 4px; transition: background 0.15s;
  }
  #closeBtn:hover { background: var(--accent-light); }

  #panel h2 { font-family: 'Playfair Display', serif; font-size: 1.7rem; margin-bottom: 6px; margin-right: 40px; line-height: 1.25; }
  #panel .panel-meta { font-size: 0.85rem; color: var(--ink-muted); margin-bottom: 20px; }
  #panel .section-label { font-size: 0.72rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; margin-top: 28px; }
  #panel .description-text { font-size: 1rem; line-height: 1.7; color: var(--ink); border-left: 3px solid var(--accent-light); padding-left: 16px; }

  .step-list { list-style: none; margin-top: 4px; }
  .step-item { display: flex; gap: 16px; margin-bottom: 18px; align-items: flex-start; }
  .step-num { flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: white; font-weight: 700; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; margin-top: 2px; }
  .step-title { font-weight: 600; font-size: 1rem; margin-bottom: 3px; }
  .step-desc { font-size: 0.875rem; color: var(--ink-muted); line-height: 1.55; }
  .step-note { font-size: 0.82rem; color: var(--accent2); background: #fdf6ec; border-left: 3px solid var(--accent2); padding: 6px 10px; margin-top: 6px; border-radius: 0 4px 4px 0; font-style: italic; }

  .loading { text-align: center; padding: 80px 20px; color: var(--ink-muted); font-size: 1rem; grid-column: 1/-1; }
  .md-body p { margin-bottom: 10px; }
  .md-body strong { font-weight: 700; }
  .md-body em { font-style: italic; }
  .md-body ul, .md-body ol { padding-left: 20px; margin-bottom: 10px; }
  .md-body li { margin-bottom: 4px; }
  .md-body a { color: var(--accent); text-decoration: underline; }
  .md-body a:hover { color: #1f4029; }
  .md-body img { max-width: 100%; border-radius: 6px; margin: 10px 0; display: block; }

  @media(max-width:600px) {
    header, .search-bar, #dashboard { padding-left: 18px; padding-right: 18px; }
    #panel { padding: 28px 20px 60px; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Prosessbibliotek</h1>
    <p>Klikk på en prosess for å lese beskrivelse og gjennomføring</p>
  </div>
</header>

<div class="search-bar">
  <input type="text" id="searchInput" placeholder="Søk etter prosess…" oninput="renderDashboard()">
</div>

<div id="dashboard"><div class="loading">Laster prosesser…</div></div>

<div id="overlay" onclick="closePanel(event)">
  <div id="panel">
    <button id="closeBtn" onclick="closePanel()">×</button>
    <div id="panelContent"></div>
  </div>
</div>

<script>
let processes = [];

function renderMd(text) {
  if (!text) return '';
  if (typeof marked !== 'undefined') { marked.setOptions({breaks:true,gfm:true}); return marked.parse(text); }
  return text.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/!\[(.+?)\]\((https?:\/\/.+?)\)/g,'<img src="$2" alt="$1">')
    .replace(/\[(.+?)\]\((https?:\/\/.+?)\)/g,'<a href="$2" target="_blank">$1</a>')
    .replace(/\n/g,'<br>');
}

async function loadProcesses() {
  try {
    const r = await fetch('processes.json?t=' + Date.now());
    processes = await r.json();
  } catch(e) {
    processes = [];
  }
  renderDashboard();
}

function renderDashboard() {
  const q = (document.getElementById('searchInput')?.value || '').toLowerCase();
  const filtered = q ? processes.filter(p => p.title.toLowerCase().includes(q) || p.description.toLowerCase().includes(q)) : processes;
  const grid = document.getElementById('dashboard');
  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-state"><h3>${q ? 'Ingen treff' : 'Ingen prosesser ennå'}</h3><p>${q ? 'Prøv et annet søkeord.' : 'Biblioteket er tomt.'}</p></div>`;
    return;
  }
  grid.innerHTML = filtered.map(p => `
    <div class="card" onclick="openPanel(${p.id})">
      <span class="card-icon">${p.icon || '📄'}</span>
      <h2>${esc(p.title)}</h2>
      <p>${esc(p.description)}</p>
      <div class="card-steps">${p.steps.length} trinn</div>
    </div>
  `).join('');

  // Legg til "Om meg"-kort på slutten (kun når det ikke søkes)
  if (!q) {
    grid.innerHTML += `
      <div class="card about-card" onclick="openAbout()">
        <span class="card-icon">👋</span>
        <h2>Om meg</h2>
        <p>Roger Klev – kontakt og lenker til mer informasjon.</p>
        <div class="card-steps">Kontakt og lenker</div>
      </div>
    `;
  }
}

function openAbout() {
  if (typeof window.plausible === 'function') {
    window.plausible('Om meg vist');
  }
  document.getElementById('panelContent').innerHTML = `
    <div style="font-size:2.2rem;margin-bottom:8px">👋</div>
    <h2>Roger Klev</h2>
    <div class="panel-meta">Kontaktinformasjon</div>

    <ul class="contact-list">
      <li>
        <div class="contact-icon">✉️</div>
        <div>
          <div class="contact-label">E-post</div>
          <div class="contact-value"><a href="mailto:roger.klev@gmail.com">roger.klev@gmail.com</a></div>
        </div>
      </li>
      <li>
        <div class="contact-icon">💼</div>
        <div>
          <div class="contact-label">LinkedIn</div>
          <div class="contact-value"><a href="https://www.linkedin.com/in/roger-klev-52945b/" target="_blank" rel="noopener">linkedin.com/in/roger-klev</a></div>
        </div>
      </li>
      <li>
        <div class="contact-icon">🌐</div>
        <div>
          <div class="contact-label">Nettsted</div>
          <div class="contact-value"><a href="https://www.forandringsompraksis.com/" target="_blank" rel="noopener">forandringsompraksis.com</a></div>
        </div>
      </li>
    </ul>
  `;
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function openPanel(id) {
  const p = processes.find(x => x.id === id);
  if (!p) return;

  // Send event to Plausible - tracks which process is viewed
  if (typeof window.plausible === 'function') {
    window.plausible('Prosess vist', { props: { prosess: p.title } });
  }

  const stepsHtml = p.steps.map((s, i) => `
    <li class="step-item">
      <div class="step-num">${i+1}</div>
      <div class="step-body">
        <div class="step-title">${esc(s.title)}</div>
        <div class="step-desc md-body">${renderMd(s.desc)}</div>
        ${s.note ? `<div class="step-note md-body">💡 ${renderMd(s.note)}</div>` : ''}
      </div>
    </li>
  `).join('');
  document.getElementById('panelContent').innerHTML = `
    <div style="font-size:2.2rem;margin-bottom:8px">${p.icon || '📄'}</div>
    <h2>${esc(p.title)}</h2>
    <div class="panel-meta">${p.steps.length} trinn</div>
    <div class="section-label">Om prosessen</div>
    <div class="description-text md-body">${renderMd(p.description)}</div>
    <div class="section-label">Gjennomføring</div>
    <ol class="step-list">${stepsHtml}</ol>
  `;
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closePanel(e) {
  if (e && e.target !== document.getElementById('overlay') && e.target !== document.getElementById('closeBtn')) return;
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

loadProcesses();
</script>
</body>
</html>
